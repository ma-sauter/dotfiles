# Hypridle configuration file

general {
    lock_cmd = pidof hyprlock || hyprlock                                    # avoid starting multiple hyprlock instances.
    before_sleep_cmd = loginctl lock-session                                 # lock before suspend.
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'  # to avoid having to press a key twice to turn on the display.
    inhibit_sleep = 3                                                        # makes sure that the system only goes to sleep after the lockscreen has been activated
}

# Turn down screen brightness after 10 min
listener {
    timeout = 600
    on-timeout = brightnessctl -s set 5
    on-resume = brightnessctl -r
}

# Turn off keyboard lights after 2 min
listener {
    timeout = 120
    on-timeout = brightnessctl -sd platform::mute set 0 & brightnessctl -sd input3::capslock set 0 & brightnessctl -sd tpacpi::kbd_backlight set 0
    on-resume = brightnessctl -rd platform::mute & brightnessctl -rd input3::capslock & brightnessctl -rd tpacpi::kbd_backlight
}
